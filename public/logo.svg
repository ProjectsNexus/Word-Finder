<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Reusable Blue Puzzle Lightbulb Component -->
    <g id="blue-bulb">
      <!-- Bulb Outer Contour -->
      <path d="M 12,56 C 2,44 2,22 14,11 C 26,0 46,0 58,11 C 70,22 70,44 60,56 L 54,66 C 51,70 48,72 43,72 L 29,72 C 24,72 21,70 18,66 Z" fill="#2E86C1"/>
      <!-- White Jigsaw Puzzle Seams -->
      <path d="M 36,2 C 36,18 28,20 28,26 C 28,32 40,32 40,26 C 40,20 36,18 36,70" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 6,36 C 21,36 24,28 30,28 C 36,28 36,40 30,40 C 24,40 21,36 66,36" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Screw Base -->
      <rect x="23" y="76" width="26" height="5" rx="2.5" fill="#2E86C1"/>
      <rect x="25" y="83" width="22" height="5" rx="2.5" fill="#2E86C1"/>
    </g>
  </defs>

  <!-- Group to contain and position all elements -->
  <g transform="translate(50, 50)"> <!-- Added a small margin -->

    <!-- Central Idea Sparks -->
    <g stroke="#F58220" stroke-width="8" stroke-linecap="round">
      <line x1="185" y1="92" x2="202" y2="108"/>
      <line x1="215" y1="70" x2="220" y2="92"/>
      <line x1="248" y1="78" x2="238" y2="98"/>
    </g>

    <!-- Left Blue Puzzle Lightbulb -->
    <use href="#blue-bulb" transform="translate(155, 96) rotate(-10, 36, 50)"/>

    <!-- Right Blue Puzzle Lightbulb -->
    <use href="#blue-bulb" transform="translate(275, 94) rotate(10, 36, 50)"/>

    <!-- Center Orange Puzzle Lightbulb (Prominent) -->
    <g transform="translate(201, 84)">
      <!-- Bulb Outer Contour -->
      <path d="M 18,74 C 4,58 4,28 20,12 C 36,-4 64,-4 80,12 C 96,28 96,58 82,74 L 74,87 C 71,92 67,95 61,95 L 39,95 C 33,95 29,92 26,87 Z" fill="#F58220"/>
      <!-- White Interlocking Jigsaw Puzzle Seams -->
      <path d="M 50,2 C 50,22 41,25 41,33 C 41,41 54,41 54,33 C 54,25 50,22 50,93" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 8,46 C 28,46 32,37 40,37 C 48,37 48,50 40,50 C 32,50 28,46 92,46" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Screw Threads and Rounded Tip Base -->
      <rect x="31" y="100" width="38" height="6.5" rx="3.2" fill="#F58220"/>
      <rect x="34" y="109" width="32" height="6.5" rx="3.2" fill="#F58220"/>
      <path d="M 40,118 C 40,125 60,125 60,118 Z" fill="#F58220"/>
    </g>

  </g>
</svg>
